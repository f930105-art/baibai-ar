<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0b0907">
<meta name="description" content="線上拜拜 AR 體驗：選一件心事，神明現身，可上香、擲筊、抽籤。">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,sans-serif}
</style>
</head>
<body>
<title>掌心香火</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;600;900&display=swap">
<style>
/* Layout: 全幅相機舞台，神明浮於中央；底部漆木供桌欄收納動作 */
:root{
  --ink:#0b0907;
  --ink-2:#17110e;
  --ink-3:#241a15;
  --ink-4:#33251d;
  --verm:#c8102e;
  --verm-2:#8d0c1f;
  --gold:#d8ab55;
  --gold-hi:#f6dfa8;
  --jade:#4e8578;
  --smoke:#ece4d8;
  --smoke-2:#a2978c;
  --ok:#7fb069;
  --no:#b5495b;
  --font-d:"Noto Serif TC",Songti TC,SimSun,serif;
  --font-b:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--smoke);
  font-family:var(--font-b);overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px;border-radius:4px}

.shell{position:relative;height:100%;width:100%;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- 開場 ---------- */
#home{
  background:
    radial-gradient(120% 70% at 50% -10%, #3a1a14 0%, transparent 60%),
    radial-gradient(90% 60% at 50% 110%, #2a140f 0%, transparent 65%),
    var(--ink);
  overflow-y:auto;
}
.home-in{
  margin:auto;width:100%;max-width:560px;
  padding-block:28px 32px;
  display:flex;flex-direction:column;align-items:center;gap:22px;
}
.plaque{
  position:relative;padding:14px 34px;
  background:linear-gradient(180deg,#1d100c,#120a07);
  border:2px solid var(--gold);border-radius:3px;
  box-shadow:0 0 0 4px #0b0907,0 0 34px -6px rgba(216,171,85,.5);
}
.plaque h1{
  margin:0;font-family:var(--font-d);font-weight:900;
  font-size:clamp(30px,9vw,44px);letter-spacing:.22em;
  color:var(--gold-hi);text-indent:.22em;
  text-shadow:0 1px 0 #5a3c15,0 0 22px rgba(246,223,168,.3);
}
.lantern{position:absolute;top:50%;width:16px;height:22px;border-radius:50% 50% 45% 45%;background:linear-gradient(180deg,var(--verm),var(--verm-2));box-shadow:0 0 16px rgba(200,16,46,.75);transform:translateY(-50%)}
.lantern.l{left:-26px}.lantern.r{right:-26px}
.tag{
  font-size:12.5px;letter-spacing:.3em;color:var(--smoke-2);
  text-indent:.3em;text-align:center;
}
.wishes{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;
}
@media (max-width:420px){.wishes{grid-template-columns:repeat(2,1fr)}}
.wish{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:16px 8px 14px;min-width:0;
  background:linear-gradient(180deg,rgba(52,37,29,.9),rgba(23,17,14,.9));
  border:1px solid #3d2c22;border-radius:10px;
  transition:border-color .2s,transform .12s,box-shadow .2s;
}
.wish:hover,.wish:focus-visible{border-color:var(--gold);box-shadow:0 0 22px -8px rgba(216,171,85,.8)}
.wish:active{transform:scale(.97)}
.wish .w-ico{width:40px;height:40px}
.wish .w-n{font-family:var(--font-d);font-size:17px;font-weight:600;letter-spacing:.08em;color:var(--gold-hi)}
.wish .w-d{font-size:11px;color:var(--smoke-2);letter-spacing:.04em}
.foot{font-size:11.5px;line-height:1.75;color:#6d645c;text-align:center;max-width:34em}
.foot b{color:var(--smoke-2);font-weight:500}

/* ---------- 神壇 ---------- */
#altar{background:var(--ink)}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
#cam.on{opacity:1}
#backdrop{
  position:absolute;inset:0;
  background:
    radial-gradient(70% 45% at 50% 42%, rgba(216,171,85,.14) 0%, transparent 70%),
    linear-gradient(180deg,#1a0f0b 0%,#120b08 45%,#0b0907 100%);
}
#backdrop::before{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(90deg,#2a1710 0 7%,transparent 7% 93%,#2a1710 93% 100%),
    repeating-linear-gradient(90deg,transparent 0 46px,rgba(216,171,85,.05) 46px 47px);
}
#backdrop::after{
  content:"";position:absolute;left:0;right:0;top:0;height:16%;
  background:linear-gradient(180deg,#3a1d13,#2a1710 60%,transparent);
  border-bottom:2px solid rgba(216,171,85,.28);
}
.bd-lantern{
  position:absolute;top:11%;width:38px;height:52px;border-radius:50% 50% 42% 42%;
  background:linear-gradient(180deg,#d4203c,#7d0a1c);
  box-shadow:0 0 40px rgba(200,16,46,.6);opacity:.9;
  animation:sway 6s ease-in-out infinite;
}
.bd-lantern::after{content:"";position:absolute;left:50%;bottom:-13px;width:2px;height:13px;background:var(--gold);transform:translateX(-50%)}
.bd-lantern.a{left:9%}
.bd-lantern.b{right:9%;animation-delay:-3s}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

#smoke{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

#figure{
  position:absolute;left:50%;top:46%;width:min(66vw,250px);
  transform:translate(-50%,-50%);
  pointer-events:none;
  animation:float 5.5s ease-in-out infinite;
  filter:drop-shadow(0 0 30px rgba(216,171,85,.45));
}
#figure svg{width:100%;height:auto;display:block}
@keyframes float{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,calc(-50% - 10px))}}
#figure.entering{animation:none;opacity:0;transform:translate(-50%,-42%) scale(.88)}
#figure.enter{animation:enter .9s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes enter{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

.hud{
  position:absolute;left:0;right:0;top:0;z-index:4;
  padding-block:12px;
  display:flex;align-items:center;gap:12px;
  background:linear-gradient(180deg,rgba(11,9,7,.82),transparent);
}
.hud .who{font-family:var(--font-d);font-size:19px;font-weight:600;letter-spacing:.1em;color:var(--gold-hi)}
.hud .for{font-size:11.5px;color:var(--smoke-2);letter-spacing:.14em;margin-top:2px}
.hud .back{
  margin-left:auto;flex:none;width:38px;height:38px;border-radius:50%;
  border:1px solid #4a372c;background:rgba(11,9,7,.6);
  font-size:17px;line-height:1;color:var(--smoke-2);
}
.cam-chip{
  position:absolute;top:60px;left:50%;transform:translateX(-50%);z-index:4;
  font-size:11px;letter-spacing:.1em;color:var(--smoke-2);
  background:rgba(11,9,7,.72);border:1px solid #3b2b22;
  padding:5px 12px;border-radius:999px;white-space:nowrap;
}

.censer{position:absolute;left:50%;bottom:118px;width:132px;transform:translateX(-50%);z-index:3}
.censer svg{width:100%;height:auto;display:block}

.rail{
  position:absolute;left:0;right:0;bottom:0;z-index:5;
  padding-block:14px 16px;
  display:flex;gap:9px;
  background:linear-gradient(180deg,transparent,rgba(11,9,7,.9) 32%,#0b0907);
  border-top:0;
}
.rail::before{
  content:"";position:absolute;left:0;right:0;top:34px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(216,171,85,.45),transparent);
}
.act{
  flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:11px 4px;border-radius:9px;
  background:linear-gradient(180deg,#2d2019,#1a1310);
  border:1px solid #42301f;
  transition:border-color .2s,opacity .2s,transform .12s;
}
.act:active{transform:scale(.96)}
.act[disabled]{opacity:.34;cursor:not-allowed}
.act:not([disabled]):hover,.act:not([disabled]):focus-visible{border-color:var(--gold)}
.act .a-n{font-family:var(--font-d);font-size:16px;font-weight:600;letter-spacing:.14em;color:var(--gold-hi);text-indent:.14em}
.act .a-d{font-size:10.5px;color:var(--smoke-2);letter-spacing:.03em}
.act.lit{border-color:var(--gold);box-shadow:0 0 20px -8px var(--gold)}

/* ---------- 結果面板 ---------- */
.sheet{
  position:absolute;inset:0;z-index:9;
  display:flex;align-items:flex-end;justify-content:center;
  background:rgba(7,5,4,.76);backdrop-filter:blur(3px);
  animation:fade .25s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-in{
  width:100%;max-width:520px;max-height:92%;overflow-y:auto;
  padding-block:22px 24px;
  background:linear-gradient(180deg,#1d1511,#120c09);
  border:1px solid #43301f;border-bottom:0;
  border-radius:16px 16px 0 0;
  box-shadow:0 -14px 50px rgba(0,0,0,.65);
  animation:rise .34s cubic-bezier(.2,.9,.3,1);
}
@keyframes rise{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{
  margin:0 0 4px;font-family:var(--font-d);font-weight:900;
  font-size:27px;letter-spacing:.14em;text-indent:.14em;text-align:center;
  text-wrap:balance;
}
.sheet .sub{font-size:12px;letter-spacing:.2em;text-indent:.2em;color:var(--smoke-2);text-align:center;margin:0 0 16px}
.cups{display:flex;justify-content:center;gap:30px;margin:4px 0 18px}
.cup-w{display:flex;flex-direction:column;align-items:center;gap:7px}
.cups svg{width:88px;height:auto}
.cup-lab{font-size:10.5px;letter-spacing:.16em;text-indent:.16em;color:var(--smoke-2)}
.cups .cup{animation:toss .75s cubic-bezier(.3,.7,.4,1)}
.cups .cup-w:nth-child(2) .cup{animation-delay:.08s}
@keyframes toss{0%{transform:translateY(-120px) rotate(-220deg);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
.verdict{font-size:14px;line-height:1.85;color:#cdc2b5;text-align:center;max-width:26em;margin:0 auto}
.streak{
  margin:14px auto 0;max-width:fit-content;
  font-size:11.5px;letter-spacing:.14em;color:var(--gold-hi);
  border:1px solid rgba(216,171,85,.45);border-radius:999px;padding:5px 14px;
}

.poem-wrap{display:flex;justify-content:center;margin:18px 0 20px}
.poem{
  writing-mode:vertical-rl;
  font-family:var(--font-d);font-size:clamp(18px,5.2vw,22px);font-weight:600;
  line-height:2.1;letter-spacing:.2em;color:var(--gold-hi);
  padding:18px 14px;border-radius:4px;
  background:linear-gradient(180deg,rgba(236,228,216,.05),transparent);
  border-right:2px solid rgba(216,171,85,.4);
  border-left:2px solid rgba(216,171,85,.4);
}
.lot-head{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:2px}
.lot-no{font-family:var(--font-d);font-size:14px;letter-spacing:.14em;color:var(--smoke-2)}
.grade{
  font-family:var(--font-d);font-size:13px;font-weight:600;letter-spacing:.14em;
  padding:3px 11px;border-radius:999px;border:1px solid currentColor;
}
.explain{
  font-size:14px;line-height:1.95;color:#cdc2b5;
  max-width:28em;margin:0 auto;
  padding-top:16px;border-top:1px solid #35261d;
}
.explain b{display:block;font-size:11px;letter-spacing:.24em;color:var(--smoke-2);font-weight:500;margin-bottom:7px}
.sheet-btns{display:flex;gap:9px;margin-top:22px}
.sbtn{
  flex:1;padding:13px;border-radius:9px;font-size:14px;letter-spacing:.1em;
  border:1px solid #4a3828;background:#241a14;transition:border-color .2s}
.sbtn:hover,.sbtn:focus-visible{border-color:var(--gold)}
.sbtn.primary{background:linear-gradient(180deg,var(--verm),var(--verm-2));border-color:#d6364f;color:#fff}

.toast{
  position:absolute;left:50%;bottom:112px;transform:translateX(-50%);z-index:8;
  font-size:12.5px;letter-spacing:.1em;color:var(--gold-hi);
  background:rgba(11,9,7,.9);border:1px solid rgba(216,171,85,.4);
  padding:9px 18px;border-radius:999px;white-space:nowrap;
  animation:toastIn .3s ease;
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translateX(-50%)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

<div class="shell">

  <section id="home" class="screen">
    <div class="home-in gut">
      <div class="plaque">
        <span class="lantern l"></span>
        <h1>掌心香火</h1>
        <span class="lantern r"></span>
      </div>
      <p class="tag">選一件心事　神明在前</p>
      <div class="wishes" id="wishes"></div>
      <p class="foot">
        上香、擲筊、抽籤皆為民俗文化之數位體驗，<b>結果由隨機決定</b>，
        僅供參考與學習，不作任何實際決策依據。
      </p>
    </div>
  </section>

  <section id="altar" class="screen" hidden>
    <video id="cam" playsinline muted autoplay></video>
    <div id="backdrop">
      <span class="bd-lantern a"></span>
      <span class="bd-lantern b"></span>
    </div>
    <canvas id="smoke"></canvas>
    <div id="figure"></div>
    <div class="censer" id="censer"></div>

    <header class="hud gut">
      <div>
        <div class="who" id="who">財神爺</div>
        <div class="for" id="for">求　財運</div>
      </div>
      <button class="back" id="back" aria-label="回到選單">✕</button>
    </header>
    <div class="cam-chip" id="camChip" hidden></div>

    <nav class="rail gut">
      <button class="act" data-act="incense" id="bIncense">
        <span class="a-n">上香</span><span class="a-d">先敬神明</span>
      </button>
      <button class="act" data-act="jiao" id="bJiao" disabled>
        <span class="a-n">擲筊</span><span class="a-d">問允不允</span>
      </button>
      <button class="act" data-act="qian" id="bQian" disabled>
        <span class="a-n">抽籤</span><span class="a-d">求一首詩</span>
      </button>
    </nav>
  </section>

</div>
<div id="sheet" hidden></div>

<script>
(function(){
"use strict";

/* ========== 神明與籤詩 ========== */
var DEITIES=[
{id:"cs",name:"財神爺",full:"武財神 趙公明",wish:"財運",desc:"求財、求業績",
 robe:"#c01f33",robe2:"#7d0f1e",trim:"#e3c069",glow:"#ffcf6b",skin:"#f3d2ae",
 hat:"wing",beard:"white",prop:"ingot",icon:"ingot",
 bless:"招財進寶　日進斗金",
 lots:[

 {g:"上吉籤",p:["春耕夏耘秋有實","莫問何時穀滿倉","腳下泥濘休嫌苦","來日方長路更長"],
  e:"正財可期，但急不得。按部就班做下去，年底自然見分曉。"},
 {g:"中籤",p:["石中藏玉人不識","待得良工琢磨時","眼前小利休貪戀","自有貴人指路歧"],
  e:"你手上有被低估的東西。別為小錢分心，等懂的人出現。"},

  e:"有受騙與投機失利之象。這陣子切勿借貸、跟會或聽信明牌。"}]},

{id:"yl",name:"月下老人",full:"月老星君",wish:"姻緣",desc:"求姻緣、求和合",

 lots:[
 {g:"上上籤",p:["千里姻緣一線牽","紅絲早繫不須憂","莫嫌相逢猶未識","明月終當照兩頭"],

 {g:"下下籤",p:["強摘之瓜終不甜","牽來之絲易斷弦","回頭看取身邊路","莫向荊叢覓牡丹"],

  e:"準備不足，這次勝算不高。及早改計畫，或者延後一年。"}]},

var stream=null;
function startCamera(){
 var chip=$("#camChip"), v=$("#cam");
 if(stream){v.classList.add("on");return;}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showChip("示範模式 · 廟宇場景");return;}
 navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false})
 .then(function(s){
   stream=s; v.srcObject=s; v.classList.add("on");
   $("#backdrop").style.opacity=".28";
   showChip("AR 相機已開啟 · 對準前方");
 })
 .catch(function(){ showChip("示範模式 · 廟宇場景"); });
}
function stopCamera(){
 if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null;}
 $("#cam").classList.remove("on"); $("#backdrop").style.opacity="";
}
function showChip(t){
 var c=$("#camChip"); c.textContent=t; c.hidden=false;
 clearTimeout(showChip._t); showChip._t=setTimeout(function(){c.hidden=true;},4200);
}

/* ========== 香煙 ========== */
var sc=$("#smoke"),sctx=sc.getContext("2d"),parts=[],raf=0,reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function sizeCanvas(){
 var r=Math.min(devicePixelRatio||1,2);
 sc.width=sc.clientWidth*r; sc.height=sc.clientHeight*r;
 sctx.setTransform(r,0,0,r,0,0);
}
addEventListener("resize",function(){if(!altarEl.hidden)sizeCanvas();});
function startSmoke(){ sizeCanvas(); if(!raf) raf=requestAnimationFrame(tick); }
function stopSmoke(){ cancelAnimationFrame(raf); raf=0; parts.length=0; sctx.clearRect(0,0,sc.width,sc.height); }
function tick(){
 raf=requestAnimationFrame(tick);
 var w=sc.clientWidth,h=sc.clientHeight;
 sctx.clearRect(0,0,w,h);
 if(state.incense&&!reduce&&parts.length<90&&Math.random()<.55){
  var bx=w/2+(Math.random()*40-20), by=h-118-34;
  parts.push({x:bx,y:by,vx:(Math.random()-.5)*.18,vy:-(.5+Math.random()*.5),r:3+Math.random()*4,a:.4+Math.random()*.2,t:0});
 }
 for(var i=parts.length-1;i>=0;i--){
  var p=parts[i]; p.t++;
  p.x+=p.vx+Math.sin(p.t/26+p.r)*.28; p.y+=p.vy; p.vy*=.995; p.r+=.22; p.a-=.0042;
  if(p.a<=0||p.y<-40){parts.splice(i,1);continue;}
  var gr=sctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*3);
  gr.addColorStop(0,"rgba(238,232,220,"+p.a.toFixed(3)+")");
  gr.addColorStop(1,"rgba(238,232,220,0)");
  sctx.fillStyle=gr; sctx.beginPath(); sctx.arc(p.x,p.y,p.r*3,0,6.283); sctx.fill();
 }
}

  body="神明答應了。心中所問，可以依此而行；但記得，神明應允的是方向，路還是得自己走。";
 }else if(kind==="xiao"){
  state.streak=0;
  title="笑　筊"; sub="兩平面朝上　笑而不答"; color="#ece4d8";
  body="神明笑而不答。通常表示問題問得不夠清楚，或者你心裡其實已經有答案了。想清楚再擲一次。";
 }else{
  state.streak=0;
  title="陰　筊"; sub="兩凸面朝上　神明不允"; color="#d47e8e";
  body="神明沒有答應。可能是時機未到，也可能該換個做法。別硬求，改個問法再試。";
 }
 var cups='<div class="cups">'+cupSVG(a)+cupSVG(b)+'</div>';
 var streak = state.streak>=3 ? '<p class="streak">連三聖杯　大允</p>' : "";
 if(state.streak>=3) state.streak=0;
 openSheet(
  '<h2 style="color:'+color+'">'+title+'</h2>'+
  '<p class="sub">'+sub+'</p>'+cups+
  '<p class="verdict">'+body+'</p>'+streak+
  '<div class="sheet-btns">'+
   '<button class="sbtn" data-close>退下</button>'+
   '<button class="sbtn primary" data-again="jiao">再擲一次</button></div>'
 );
}
function doQian(){
 var d=state.deity;
 var i=Math.floor(Math.random()*d.lots.length), lot=d.lots[i];
 var no=["第一籤","第二籤","第三籤","第四籤","第五籤"][i];
 var col=GRADE_COLOR[lot.g]||"#ece4d8";
 var poem=lot.p.join("\n");
 openSheet(
  '<div class="lot-head"><span class="lot-no">'+d.name+'　'+no+'</span>'+
   '<span class="grade" style="color:'+col+'">'+lot.g+'</span></div>'+
  '<div class="poem-wrap"><div class="poem">'+poem.replace(/\n/g,"<br>")+'</div></div>'+
  '<div class="explain"><b>解　曰</b>'+lot.e+'</div>'+
  '<div class="sheet-btns">'+
   '<button class="sbtn" data-close>收籤</button>'+
   '<button class="sbtn primary" data-again="qian">再抽一支</button></div>'
 );
}
function openSheet(html){
 sheetEl.className="sheet"; sheetEl.hidden=false;
 sheetEl.innerHTML='<div class="sheet-in gut" role="dialog" aria-modal="true">'+html+'</div>';
 var f=sheetEl.querySelector(".sbtn"); if(f) f.focus();
}
function closeSheet(){ sheetEl.hidden=true; sheetEl.innerHTML=""; }
sheetEl.addEventListener("click",function(e){
 if(e.target===sheetEl){closeSheet();return;}
 if(e.target.closest("[data-close]")){closeSheet();return;}
 var ag=e.target.closest("[data-again]");
 if(ag){ closeSheet(); setTimeout(function(){ ag.dataset.again==="jiao"?doJiao():doQian(); },140); }
});
addEventListener("keydown",function(e){ if(e.key==="Escape"){ sheetEl.hidden?closeAltar():closeSheet(); }});

/* 搖手機擲筊（自行架站 + 使用者授權後可用） */
var lastShake=0;
function onShake(e){
 var a=e.accelerationIncludingGravity; if(!a) return;
 var m=Math.abs(a.x||0)+Math.abs(a.y||0)+Math.abs(a.z||0);
 if(m>34&&Date.now()-lastShake>1400&&!altarEl.hidden&&sheetEl.hidden&&state.incense){
  lastShake=Date.now(); doJiao();
 }
}
if(typeof DeviceMotionEvent!=="undefined"&&!DeviceMotionEvent.requestPermission){
 addEventListener("devicemotion",onShake);
}

/* 熱更新時保留當下神明 */
try{
 var boot=function(s){ if(s&&s.id){ for(var i=0;i<DEITIES.length;i++) if(DEITIES[i].id===s.id){openAltar(DEITIES[i]);break;} } };
 if(window.claude&&window.claude.hot){
  window.claude.hot.snapshot(function(){return state.deity?{id:state.deity.id}:{};});
  window.claude.hot.ready?window.claude.hot.ready(boot):boot(window.claude.hot.data||{});
 }
}catch(err){}
})();
</script>
