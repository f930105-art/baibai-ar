<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0b0907">
<meta name="description" content="Taiwanese temple worship in AR / 線上拜拜 AR：六十甲子籤、拜拜流程、神明簡介，中英雙語含拼音與台羅。">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,sans-serif}
</style>
</head>
<body>
<title>掌心香火</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;600;900&display=swap">
<style>
/* Layout: 全幅相機舞台，神明以陀螺儀錨定於空間；底部漆木供桌欄收納動作 */
:root{
  --ink:#0b0907; --ink-2:#17110e; --ink-3:#241a15;
  --verm:#c8102e; --verm-2:#8d0c1f;
  --gold:#d8ab55; --gold-hi:#f6dfa8;
  --jade:#4e8578; --smoke:#ece4d8; --smoke-2:#a2978c;
  --font-d:"Noto Serif TC",Songti TC,SimSun,serif;
  --font-b:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--smoke);font-family:var(--font-b);
  overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px;border-radius:4px}

.shell{position:relative;height:100%;width:100%;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- 開場 ---------- */
#home{background:
   radial-gradient(120% 70% at 50% -10%, #3a1a14 0%, transparent 60%),
   radial-gradient(90% 60% at 50% 110%, #2a140f 0%, transparent 65%), var(--ink);
  overflow-y:auto}
.home-in{margin:auto;width:100%;max-width:560px;padding-block:28px 32px;
  display:flex;flex-direction:column;align-items:center;gap:22px}
.plaque{position:relative;padding:14px 34px;
  background:linear-gradient(180deg,#1d100c,#120a07);
  border:2px solid var(--gold);border-radius:3px;
  box-shadow:0 0 0 4px #0b0907,0 0 34px -6px rgba(216,171,85,.5)}
.plaque h1{margin:0;font-family:var(--font-d);font-weight:900;
  font-size:clamp(30px,9vw,44px);letter-spacing:.22em;color:var(--gold-hi);text-indent:.22em;
  text-shadow:0 1px 0 #5a3c15,0 0 22px rgba(246,223,168,.3)}
.lantern{position:absolute;top:50%;width:16px;height:22px;border-radius:50% 50% 45% 45%;
  background:linear-gradient(180deg,var(--verm),var(--verm-2));
  box-shadow:0 0 16px rgba(200,16,46,.75);transform:translateY(-50%)}
.lantern.l{left:-26px}.lantern.r{right:-26px}
.tag{font-size:12.5px;letter-spacing:.3em;color:var(--smoke-2);text-indent:.3em;text-align:center}
.wishes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
@media (max-width:420px){.wishes{grid-template-columns:repeat(2,1fr)}}
.wish{display:flex;flex-direction:column;align-items:center;gap:7px;padding:16px 8px 14px;min-width:0;
  background:linear-gradient(180deg,rgba(52,37,29,.9),rgba(23,17,14,.9));
  border:1px solid #3d2c22;border-radius:10px;
  transition:border-color .2s,transform .12s,box-shadow .2s}
.wish:hover,.wish:focus-visible{border-color:var(--gold);box-shadow:0 0 22px -8px rgba(216,171,85,.8)}
.wish:active{transform:scale(.97)}
.wish .w-ico{width:40px;height:40px}
.wish .w-n{font-family:var(--font-d);font-size:17px;font-weight:600;letter-spacing:.08em;color:var(--gold-hi)}
.wish .w-d{font-size:11px;color:var(--smoke-2);letter-spacing:.04em}
.foot{font-size:11.5px;line-height:1.75;color:#6d645c;text-align:center;max-width:34em}
.foot b{color:var(--smoke-2);font-weight:500}

/* ---------- 神壇 ---------- */
#altar{background:var(--ink)}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s;z-index:0}
#cam.on{opacity:1}
#backdrop{position:absolute;inset:0;z-index:1;
  background:radial-gradient(70% 45% at 50% 42%, rgba(216,171,85,.14) 0%, transparent 70%),
   linear-gradient(180deg,#1a0f0b 0%,#120b08 45%,#0b0907 100%)}
#backdrop::before{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,#2a1710 0 7%,transparent 7% 93%,#2a1710 93% 100%),
   repeating-linear-gradient(90deg,transparent 0 46px,rgba(216,171,85,.05) 46px 47px)}
#backdrop::after{content:"";position:absolute;left:0;right:0;top:0;height:16%;
  background:linear-gradient(180deg,#3a1d13,#2a1710 60%,transparent);
  border-bottom:2px solid rgba(216,171,85,.28)}
.bd-lantern{position:absolute;top:11%;width:38px;height:52px;border-radius:50% 50% 42% 42%;
  background:linear-gradient(180deg,#d4203c,#7d0a1c);box-shadow:0 0 40px rgba(200,16,46,.6);
  opacity:.9;animation:sway 6s ease-in-out infinite}
.bd-lantern::after{content:"";position:absolute;left:50%;bottom:-13px;width:2px;height:13px;background:var(--gold);transform:translateX(-50%)}
.bd-lantern.a{left:9%}.bd-lantern.b{right:9%;animation-delay:-3s}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

#smoke{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}

#figure{position:absolute;left:50%;top:46%;width:min(66vw,250px);z-index:3;
  pointer-events:none;will-change:transform;
  filter:drop-shadow(0 0 30px rgba(216,171,85,.45))}
#figure .fl{animation:float 5.5s ease-in-out infinite}
#figure svg{width:100%;height:auto;display:block}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
#figure.entering{opacity:0}
#figure.enter{animation:enter .9s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes enter{from{opacity:0}to{opacity:1}}

.censer{position:absolute;left:50%;bottom:132px;width:132px;transform:translateX(-50%);z-index:3;pointer-events:none}
.censer svg{width:100%;height:auto;display:block}

#touch{position:absolute;inset:0;z-index:4;touch-action:none}

#ghost{position:absolute;z-index:4;pointer-events:none;
  font-size:11px;letter-spacing:.12em;color:var(--gold-hi);white-space:nowrap;
  background:rgba(11,9,7,.85);border:1px solid rgba(216,171,85,.5);
  padding:6px 12px;border-radius:999px;transform:translate(-50%,-50%)}

.hud{position:absolute;left:0;right:0;top:0;z-index:6;padding-block:12px;
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,rgba(11,9,7,.82),transparent)}
.hud .who{font-family:var(--font-d);font-size:19px;font-weight:600;letter-spacing:.1em;color:var(--gold-hi)}
.hud .for{font-size:11.5px;color:var(--smoke-2);letter-spacing:.14em;margin-top:2px}
.hud .sp{margin-left:auto}
.icbtn{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid #4a372c;
  background:rgba(11,9,7,.6);font-size:16px;line-height:1;color:var(--smoke-2);
  display:flex;align-items:center;justify-content:center;transition:border-color .2s,color .2s}
.icbtn:hover,.icbtn:focus-visible{border-color:var(--gold);color:var(--gold-hi)}
.icbtn.on{border-color:var(--gold);color:var(--gold-hi);box-shadow:0 0 18px -6px var(--gold)}
.icbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.chip{position:absolute;top:62px;left:50%;transform:translateX(-50%);z-index:6;
  font-size:11px;letter-spacing:.1em;color:var(--smoke-2);
  background:rgba(11,9,7,.78);border:1px solid #3b2b22;
  padding:5px 12px;border-radius:999px;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}

#hint{position:absolute;left:50%;bottom:238px;transform:translateX(-50%);z-index:6;
  display:flex;flex-direction:column;align-items:center;gap:8px;white-space:nowrap}
#hint .ht{font-family:var(--font-d);font-size:15px;letter-spacing:.16em;text-indent:.16em;color:var(--gold-hi);
  background:rgba(11,9,7,.8);border:1px solid rgba(216,171,85,.4);padding:8px 18px;border-radius:999px}
#hint .hs{font-size:11px;letter-spacing:.08em;color:var(--smoke-2);border-bottom:1px dashed #5a4a3c;padding-bottom:1px}

.rail{position:absolute;left:0;right:0;bottom:0;z-index:6;padding-block:14px 16px;display:flex;gap:7px;
  background:linear-gradient(180deg,transparent,rgba(11,9,7,.9) 32%,#0b0907)}
.rail::before{content:"";position:absolute;left:0;right:0;top:34px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(216,171,85,.45),transparent)}
.act{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:11px 2px;border-radius:9px;background:linear-gradient(180deg,#2d2019,#1a1310);
  border:1px solid #42301f;transition:border-color .2s,opacity .2s,transform .12s}
.act:active{transform:scale(.96)}
.act[disabled]{opacity:.34;cursor:not-allowed}
.act:not([disabled]):hover,.act:not([disabled]):focus-visible{border-color:var(--gold)}
.act .a-n{font-family:var(--font-d);font-size:15px;font-weight:600;letter-spacing:.1em;color:var(--gold-hi);text-indent:.1em}
.act .a-d{font-size:9.5px;color:var(--smoke-2);letter-spacing:.02em}
.act.lit{border-color:var(--gold);box-shadow:0 0 20px -8px var(--gold)}

/* ---------- 面板 ---------- */
.sheet{position:absolute;inset:0;z-index:9;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(7,5,4,.76);backdrop-filter:blur(3px);animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-in{width:100%;max-width:520px;max-height:92%;overflow-y:auto;padding-block:22px 24px;
  background:linear-gradient(180deg,#1d1511,#120c09);border:1px solid #43301f;border-bottom:0;
  border-radius:16px 16px 0 0;box-shadow:0 -14px 50px rgba(0,0,0,.65);
  animation:rise .34s cubic-bezier(.2,.9,.3,1)}
@keyframes rise{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 4px;font-family:var(--font-d);font-weight:900;font-size:27px;
  letter-spacing:.14em;text-indent:.14em;text-align:center;text-wrap:balance}
.sheet .sub{font-size:12px;letter-spacing:.2em;text-indent:.2em;color:var(--smoke-2);text-align:center;margin:0 0 16px}
.cups{display:flex;justify-content:center;gap:30px;margin:4px 0 18px}
.cup-w{display:flex;flex-direction:column;align-items:center;gap:7px}
.cups svg{width:88px;height:auto}
.cup-lab{font-size:10.5px;letter-spacing:.16em;text-indent:.16em;color:var(--smoke-2)}
.cups .cup{animation:toss .75s cubic-bezier(.3,.7,.4,1)}
.cups .cup-w:nth-child(2) .cup{animation-delay:.08s}
@keyframes toss{0%{transform:translateY(-120px) rotate(-220deg);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
.verdict{font-size:14px;line-height:1.85;color:#cdc2b5;text-align:center;max-width:26em;margin:0 auto}
.streak{margin:14px auto 0;max-width:fit-content;font-size:11.5px;letter-spacing:.14em;color:var(--gold-hi);
  border:1px solid rgba(216,171,85,.45);border-radius:999px;padding:5px 14px}
.poem-wrap{display:flex;justify-content:center;margin:18px 0 20px}
.poem{writing-mode:vertical-rl;font-family:var(--font-d);font-size:clamp(18px,5.2vw,22px);font-weight:600;
  line-height:2.1;letter-spacing:.2em;color:var(--gold-hi);padding:18px 14px;border-radius:4px;
  background:linear-gradient(180deg,rgba(236,228,216,.05),transparent);
  border-right:2px solid rgba(216,171,85,.4);border-left:2px solid rgba(216,171,85,.4)}
.lot-head{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:2px}
.lot-no{font-family:var(--font-d);font-size:14px;letter-spacing:.14em;color:var(--smoke-2)}
.grade{font-family:var(--font-d);font-size:13px;font-weight:600;letter-spacing:.14em;
  padding:3px 11px;border-radius:999px;border:1px solid currentColor}
.explain{font-size:14px;line-height:1.95;color:#cdc2b5;max-width:28em;margin:0 auto;
  padding-top:16px;border-top:1px solid #35261d}
.explain b{display:block;font-size:11px;letter-spacing:.24em;color:var(--smoke-2);font-weight:500;margin-bottom:7px}
.shot{display:block;width:100%;max-width:300px;margin:0 auto 16px;border-radius:8px;border:1px solid #43301f}
.sheet-btns{display:flex;gap:9px;margin-top:22px}
.sbtn{flex:1;padding:13px;border-radius:9px;font-size:14px;letter-spacing:.1em;
  border:1px solid #4a3828;background:#241a14;transition:border-color .2s}
.sbtn:hover,.sbtn:focus-visible{border-color:var(--gold)}
.sbtn.primary{background:linear-gradient(180deg,var(--verm),var(--verm-2));border-color:#d6364f;color:#fff}

.toast{position:absolute;left:50%;bottom:126px;transform:translateX(-50%);z-index:8;
  font-size:12.5px;letter-spacing:.1em;color:var(--gold-hi);background:rgba(11,9,7,.9);
  border:1px solid rgba(216,171,85,.4);padding:9px 18px;border-radius:999px;white-space:nowrap;
  animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translateX(-50%)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
/* ---- v3 新增 ---- */
.linkbtn{font-size:12px;letter-spacing:.1em;color:var(--smoke-2);
  border:1px solid #3d2c22;border-radius:999px;padding:9px 20px;transition:border-color .2s,color .2s}
.linkbtn:hover,.linkbtn:focus-visible{border-color:var(--gold);color:var(--gold-hi)}
.wish{position:relative}
.info{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;
  border:1px solid #4a372c;color:var(--smoke-2);font-size:11px;line-height:1;
  display:flex;align-items:center;justify-content:center}
.info:hover,.info:focus-visible{border-color:var(--gold);color:var(--gold-hi)}

/* 教學 / 簡介 捲動頁 */
#page{position:absolute;inset:0;z-index:11;overflow-y:auto;background:
  radial-gradient(120% 60% at 50% -10%, #3a1a14 0%, transparent 55%), var(--ink)}
.page-in{max-width:620px;margin:0 auto;padding-block:16px 48px}
.page-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;display:flex;align-items:center;gap:12px;
  padding-block:12px;margin-bottom:8px;background:linear-gradient(180deg,#1a0f0b 70%,transparent)}
.page-top h2{margin:0;font-family:var(--font-d);font-size:21px;font-weight:900;letter-spacing:.16em;color:var(--gold-hi)}
.sec{margin-top:26px}
.sec > h3{display:flex;align-items:center;gap:10px;margin:0 0 12px;
  font-family:var(--font-d);font-size:17px;font-weight:600;letter-spacing:.12em;color:var(--gold-hi)}
.sec > h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(216,171,85,.4),transparent)}
.step{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid #2a1f18}
.step:last-child{border-bottom:0}
.step .n{flex:none;width:27px;height:27px;border-radius:50%;border:1px solid var(--gold);
  color:var(--gold-hi);font-size:13px;display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums}
.step .b{min-width:0}
.step .t{font-size:14.5px;color:var(--smoke);line-height:1.6}
.step .d{font-size:12.5px;color:var(--smoke-2);line-height:1.75;margin-top:4px}
.step .d em{font-style:normal;color:var(--gold-hi)}
.warn{display:flex;gap:10px;padding:12px 14px;border-radius:9px;margin-top:10px;
  background:rgba(200,16,46,.09);border:1px solid rgba(200,16,46,.4)}
.warn .wi{flex:none;color:#e0657a;font-size:14px}
.warn .wt{font-size:13px;line-height:1.7;color:#d9c9c2}
.kv{display:grid;grid-template-columns:4.6em 1fr;gap:8px 14px;font-size:13.5px;line-height:1.7}
.kv dt{color:var(--smoke-2);letter-spacing:.1em}
.kv dd{margin:0;color:var(--smoke)}
.kv dd small{color:#8a7f74;font-size:11.5px}
.gods{display:flex;flex-direction:column;gap:14px}
.god{padding:16px;border-radius:11px;background:linear-gradient(180deg,#1f1712,#15100d);border:1px solid #39291f}
.god-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.god-h .gi{width:42px;height:42px;flex:none}
.god-h .gn{font-family:var(--font-d);font-size:18px;font-weight:600;letter-spacing:.1em;color:var(--gold-hi)}
.god-h .gf{font-size:11.5px;color:var(--smoke-2);margin-top:2px}

/* 上香三步 */
#rite{position:absolute;left:0;right:0;bottom:96px;z-index:7;pointer-events:none}
#rite .bar{display:flex;justify-content:center;gap:7px;margin-bottom:12px}
#rite .pip{font-size:10.5px;letter-spacing:.1em;color:#6d645c;
  border:1px solid #3b2b22;border-radius:999px;padding:4px 11px;background:rgba(11,9,7,.78)}
#rite .pip.on{color:var(--gold-hi);border-color:var(--gold)}
#rite .pip.done{color:var(--jade);border-color:rgba(78,133,120,.6)}
#joss{position:absolute;z-index:7;width:86px;touch-action:none;will-change:transform}
#joss svg{width:100%;height:auto;display:block;filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))}
#candle{position:absolute;z-index:6;width:54px;pointer-events:none}
#candle svg{width:100%;height:auto;display:block}
.drop{position:absolute;z-index:5;border:2px dashed rgba(216,171,85,.55);border-radius:50%;
  pointer-events:none;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:.9;transform:scale(1.06)}}

/* 求籤流程 */
.rite-note{font-size:12.5px;line-height:1.8;color:var(--smoke-2);text-align:center;max-width:24em;margin:0 auto 4px}
.tally{display:flex;justify-content:center;gap:9px;margin:14px 0 4px}
.tally i{width:11px;height:11px;border-radius:50%;border:1px solid #4a3828;font-style:normal}
.tally i.ok{background:var(--gold);border-color:var(--gold);box-shadow:0 0 10px -2px var(--gold)}
.qno{font-family:var(--font-d);font-size:40px;font-weight:900;letter-spacing:.1em;
  color:var(--gold-hi);text-align:center;margin:10px 0 2px}
.qgz{font-size:13px;letter-spacing:.3em;text-indent:.3em;color:var(--smoke-2);text-align:center}
.jie{display:grid;grid-template-columns:3.4em 1fr;gap:7px 12px;font-size:13px;line-height:1.65;
  margin-top:16px;padding-top:14px;border-top:1px solid #35261d}
.jie dt{color:var(--smoke-2);letter-spacing:.08em}
.jie dd{margin:0;color:#cdc2b5}
.jie .hi dt{color:var(--gold-hi)}
.jie .hi dd{color:var(--gold-hi)}
.jie .row{display:contents}
.story{font-size:12.5px;line-height:1.75;color:var(--smoke-2);margin-top:14px;
  padding:11px 13px;border-radius:8px;background:rgba(236,228,216,.04)}
.story b{color:var(--gold-hi);font-weight:500}
.tone{display:inline-block;font-family:var(--font-d);font-size:13px;font-weight:600;
  letter-spacing:.14em;padding:3px 12px;border-radius:999px;border:1px solid currentColor}
.srcline{font-size:10.5px;line-height:1.7;color:#5f574f;text-align:center;margin-top:18px}
.form{display:grid;grid-template-columns:5.2em 1fr;gap:10px 12px;align-items:center;margin:16px 0 4px}
.form label{font-size:12.5px;letter-spacing:.1em;color:var(--smoke-2)}
.form input{width:100%;min-width:0;padding:11px 12px;border-radius:8px;font-size:14px;
  background:#120c09;border:1px solid #43301f;color:var(--smoke);font-family:inherit}
.form input::placeholder{color:#5f574f}
.form input:focus{outline:none;border-color:var(--gold)}
.langbtn{position:absolute;top:max(10px,env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));
  z-index:3;font-size:11.5px;letter-spacing:.14em;color:var(--smoke-2);

function AC(){
 if(!SND.ac){ var C=window.AudioContext||window.webkitAudioContext; if(!C) return null; SND.ac=new C(); }
 if(SND.ac.state==="suspended") SND.ac.resume();
 return SND.ac;

/* 木質撞擊：筊杯落地 */
function clack(t0,gain){
 var ac=AC(); if(!ac) return;
 var o=ac.createOscillator(), g=ac.createGain(), f=ac.createBiquadFilter();
 o.type="triangle"; o.frequency.setValueAtTime(420+Math.random()*140,t0);
 o.frequency.exponentialRampToValueAtTime(110,t0+0.09);
 f.type="bandpass"; f.frequency.value=900; f.Q.value=1.2;
 g.gain.setValueAtTime(0,t0);
 g.gain.linearRampToValueAtTime((gain||0.3),t0+0.004);
 g.gain.exponentialRampToValueAtTime(0.001,t0+0.16);
 o.connect(f); f.connect(g); g.connect(ac.destination);
 o.start(t0); o.stop(t0+0.18);
}
/* 竹籤摩擦：搖籤筒 */
function rattle(dur){
 var ac=AC(); if(!ac) return;
 var n=Math.floor(ac.sampleRate*(dur||0.8)), buf=ac.createBuffer(1,n,ac.sampleRate), ch=buf.getChannelData(0);
 for(var i=0;i<n;i++){ var env=Math.pow(1-i/n,1.4); ch[i]=(Math.random()*2-1)*env*(Math.random()<0.08?1:0.25); }
 var s=ac.createBufferSource(); s.buffer=buf;
 var f=ac.createBiquadFilter(); f.type="bandpass"; f.frequency.value=2200; f.Q.value=0.8;
 var g=ac.createGain(); g.gain.value=0.22;
 s.connect(f); f.connect(g); g.connect(ac.destination); s.start();
}
/* 磬聲：上香完成 */
function bell(){
 var ac=AC(); if(!ac) return; var t0=ac.currentTime;
 [1,2.76,5.4].forEach(function(m,i){
  var o=ac.createOscillator(), g=ac.createGain();
  o.type="sine"; o.frequency.value=528*m;
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(0.18/(i+1),t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0008,t0+2.6-i*0.5);
  o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0+2.8);
 });
}
function sfx(kind){
 if(!SND.on) return;
 var ac=AC(); if(!ac) return; var t=ac.currentTime;
 if(kind==="jiao"){ clack(t+0.02,0.32); clack(t+0.13,0.26); clack(t+0.30,0.14); clack(t+0.40,0.10); }
 else if(kind==="rattle") rattle(0.9);
 else if(kind==="bell") bell();
 else if(kind==="tick") clack(t,0.14);
}

function pickVoice(code){
 for(var i=0;i<VOICES.length;i++) if(VOICES[i].lang&&VOICES[i].lang.replace("_","-").toLowerCase()===code.toLowerCase()) return VOICES[i];
 var base=code.split("-")[0].toLowerCase();
 for(var j=0;j<VOICES.length;j++) if(VOICES[j].lang&&VOICES[j].lang.toLowerCase().indexOf(base)===0) return VOICES[j];
 return null;
}

  var v=pickVoice(u.lang); if(v) u.voice=v;
  u.rate=rate||0.92; u.pitch=1;
  speechSynthesis.speak(u);
  return true;
 }catch(e){ return false; }
}

/* ========== 動作感測：權限 + 搖晃偵測（差分演算法） ========== */
var motion={bound:false,granted:false,last:null,lastT:0,supported:false};
var shakeWant=null, shakeGuard=0;
function onMotion(e){
 var a=e.accelerationIncludingGravity||e.acceleration; if(!a) return;
 motion.supported=true;
 var now=Date.now();
 if(!motion.last){motion.last={x:a.x||0,y:a.y||0,z:a.z||0};motion.lastT=now;return;}
 var dt=now-motion.lastT; if(dt<40) return;
 motion.lastT=now;
 var dx=(a.x||0)-motion.last.x,dy=(a.y||0)-motion.last.y,dz=(a.z||0)-motion.last.z;
 motion.last={x:a.x||0,y:a.y||0,z:a.z||0};
 var sp=Math.sqrt(dx*dx+dy*dy+dz*dz)/dt*1000;
 if(sp>720&&shakeWant&&now-shakeGuard>700){shakeGuard=now;var f=shakeWant;f();}
}
function bindMotion(){
 if(motion.bound) return;
 motion.bound=true; motion.granted=true;
 addEventListener("devicemotion",onMotion);
}
function needsPrompt(){
 return (typeof DeviceMotionEvent!=="undefined"&&!!DeviceMotionEvent.requestPermission)
     || (typeof DeviceOrientationEvent!=="undefined"&&!!DeviceOrientationEvent.requestPermission);
}
function askMotion(){
 if(motion.granted) return Promise.resolve(true);
 var ps=[];
 if(typeof DeviceMotionEvent!=="undefined"&&DeviceMotionEvent.requestPermission) ps.push(DeviceMotionEvent.requestPermission());
 if(typeof DeviceOrientationEvent!=="undefined"&&DeviceOrientationEvent.requestPermission) ps.push(DeviceOrientationEvent.requestPermission());
 if(!ps.length){bindMotion();return Promise.resolve(true);}
 return Promise.all(ps).then(function(r){
  var ok=r.every(function(x){return x==="granted"});
  if(ok){bindMotion();bindOrient();}
  return ok;
 }).catch(function(){return false});
}
if(!needsPrompt()) bindMotion();

/* 觸控替代：左右來回滑也算「搖」 */
var swipe={x:0,flips:0,dir:0,t:0};
function swipeShake(x){
 var now=Date.now();
 if(now-swipe.t>700){swipe.flips=0;swipe.dir=0;}
 swipe.t=now;
 var d=x-swipe.x; swipe.x=x;
 if(Math.abs(d)<16) return;
 var nd=d>0?1:-1;
 if(swipe.dir&&nd!==swipe.dir) swipe.flips++;
 swipe.dir=nd;
 if(swipe.flips>=3&&shakeWant&&now-shakeGuard>700){
  shakeGuard=now;swipe.flips=0;var f=shakeWant;f();
 }
}

/* ========== 陀螺儀空間錨定 ========== */
function angDiff(a,b){var d=a-b;while(d>180)d-=360;while(d<-180)d+=360;return d}
function onOrient(e){
 if(e.alpha==null||e.beta==null) return;
 gyro.cur={a:e.alpha,b:e.beta};
 if(!gyro.anchor) gyro.anchor={a:e.alpha,b:e.beta};
 var ppd=Math.max(innerWidth,320)/58;
 gyro.dx=clamp(angDiff(e.alpha,gyro.anchor.a)*ppd,-3000,3000);
 gyro.dy=clamp((e.beta-gyro.anchor.b)*ppd*0.9,-3000,3000);
}
function bindOrient(){
 if(gyro.on) return;
 gyro.on=true; gyro.anchor=null;
 addEventListener("deviceorientation",onOrient);
 $("#bAnchor").classList.add("on");
}
$("#bAnchor").addEventListener("click",function(){
 if(gyro.on){gyro.on=false;gyro.dx=0;gyro.dy=0;
  removeEventListener("deviceorientation",onOrient);
  $("#bAnchor").classList.remove("on");chip(U("anchorOff"));return;}
 askMotion().then(function(ok){
  if(ok){bindOrient();chip(U("anchorOn"));}
  else chip(U("anchorNo"));
 });
});
$("#bReset").addEventListener("click",function(){
 place.x=0;place.y=0;place.scale=1;
 if(gyro.cur) gyro.anchor={a:gyro.cur.a,b:gyro.cur.b};
 gyro.dx=0;gyro.dy=0;applyFigure();chip(U("recentre"));
});
function applyFigure(){

  (place.y+gyro.dy).toFixed(1)+"px)) scale("+place.scale.toFixed(3)+")";
 var cx=innerWidth/2+place.x+gyro.dx, cy=innerHeight*0.46+place.y+gyro.dy, gh=$("#ghost"), m=70;
 if(cx<m||cx>innerWidth-m||cy<m||cy>innerHeight-m){
  gh.textContent=(cx<m?"◀ ":"")+state.deity.name+(cx>innerWidth-m?" ▶":"");
  gh.style.left=clamp(cx,m,innerWidth-m)+"px"; gh.style.top=clamp(cy,m,innerHeight-m)+"px";
  gh.hidden=false;
 } else gh.hidden=true;
}

/* ========== 拖曳擺放 ＋ 雙指縮放 ＋ 上香拖曳 ========== */
var ptrs={},pinch0=null,drag0=null,jossDrag=null;
touchEl.addEventListener("pointerdown",function(e){
 touchEl.setPointerCapture(e.pointerId);
 ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
 if(rite.on){ onRiteDown(e); return; }
 var ks=Object.keys(ptrs);
 if(ks.length===2){var a=ptrs[ks[0]],b=ptrs[ks[1]];
  pinch0={d:Math.hypot(a.x-b.x,a.y-b.y),s:place.scale};drag0=null;}
 else if(ks.length===1) drag0={x:e.clientX,y:e.clientY,px:place.x,py:place.y};
});
touchEl.addEventListener("pointermove",function(e){
 if(!ptrs[e.pointerId]) return;
 ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
 if(rite.on){ onRiteMove(e); return; }
 if(shakeWant) swipeShake(e.clientX);
 var ks=Object.keys(ptrs);
 if(ks.length>=2&&pinch0){var a=ptrs[ks[0]],b=ptrs[ks[1]];
  place.scale=clamp(pinch0.s*(Math.hypot(a.x-b.x,a.y-b.y)/pinch0.d),0.45,2.4);}
 else if(drag0){place.x=drag0.px+(e.clientX-drag0.x);place.y=drag0.py+(e.clientY-drag0.y);}
});
function ptrUp(e){
 delete ptrs[e.pointerId];
 if(Object.keys(ptrs).length<2) pinch0=null;
 if(!Object.keys(ptrs).length){drag0=null; if(rite.on) onRiteUp(e);}
}
touchEl.addEventListener("pointerup",ptrUp);
touchEl.addEventListener("pointercancel",ptrUp);

/* ========== 香煙 ＋ 繪製迴圈 ========== */
var sc=$("#smoke"),sctx=sc.getContext("2d"),parts=[],raf=0;
function sizeCanvas(){var r=Math.min(devicePixelRatio||1,2);
 sc.width=sc.clientWidth*r;sc.height=sc.clientHeight*r;sctx.setTransform(r,0,0,r,0,0);}
function startLoop(){sizeCanvas();if(!raf)raf=requestAnimationFrame(tick);}
function stopLoop(){cancelAnimationFrame(raf);raf=0;parts.length=0;sctx.clearRect(0,0,sc.width,sc.height);}
function emitSmoke(){
 if(!state.incense||reduce||parts.length>=90||Math.random()>=.55) return;
 var r=$("#censer").getBoundingClientRect();
 parts.push({x:r.left+r.width/2+(Math.random()*40-20),y:r.top+r.height*0.34,
  vx:(Math.random()-.5)*.18,vy:-(.5+Math.random()*.5),r:3+Math.random()*4,a:.4+Math.random()*.2,t:0});
}
function stepSmoke(){for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.t++;
 p.x+=p.vx+Math.sin(p.t/26+p.r)*.28;p.y+=p.vy;p.vy*=.995;p.r+=.22;p.a-=.0042;
 if(p.a<=0||p.y<-40)parts.splice(i,1);}}
function drawSmoke(g,k){for(var i=0;i<parts.length;i++){var p=parts[i],R=p.r*3*k,X=p.x*k,Y=p.y*k;
 var gr=g.createRadialGradient(X,Y,0,X,Y,R);
 gr.addColorStop(0,"rgba(238,232,220,"+p.a.toFixed(3)+")");gr.addColorStop(1,"rgba(238,232,220,0)");
 g.fillStyle=gr;g.beginPath();g.arc(X,Y,R,0,6.283);g.fill();}}
function tick(){raf=requestAnimationFrame(tick);
 sctx.clearRect(0,0,sc.clientWidth,sc.clientHeight);
 emitSmoke();stepSmoke();drawSmoke(sctx,1);applyFigure();}

function markDrop(el){

 var r=el.getBoundingClientRect(), d=document.createElement("div");
 d.className="drop"; var s=Math.max(r.width,r.height)+34;
 d.style.width=s+"px"; d.style.height=s+"px";

function jossCenter(){var r=jossEl.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height*0.12}}
function near(el,pt,pad){var r=el.getBoundingClientRect();
 return Math.hypot(pt.x-(r.left+r.width/2),pt.y-(r.top+r.height/2))< (Math.max(r.width,r.height)/2+(pad||46));}
function onRiteDown(e){
 if(rite.step===2) return;
 rite.drag=true; var r=jossEl.getBoundingClientRect();
 rite.ox=e.clientX-r.left; rite.oy=e.clientY-r.top;
}
function onRiteMove(e){

 rite.x=e.clientX-rite.ox; rite.y=e.clientY-rite.oy;
 jossEl.style.left=rite.x+"px"; jossEl.style.top=rite.y+"px";
}
function onRiteUp(){

 var pt=jossCenter();
 if(rite.step===1&&near(candleEl,pt,54)){
  jossEl.innerHTML=jossSVG(1); rite.step=2; pips(); clearDrop();
  shakeWant=function(){ if(rite.step!==2) return;
   jossEl.innerHTML=jossSVG(2); rite.step=3; pips(); shakeWant=null;
   markDrop($("#censer"));
   showHint(U("r3"),U("rSkip"),function(){finishRite();});
   toast(U("rBlow"));
  };
  showHint(U("r2"),U("rSkip2"),function(){ if(shakeWant) shakeWant(); });
  return;
 }
 if(rite.step===3&&near($("#censer"),pt,56)){ finishRite(); return; }
}

 $("#censer").innerHTML=censerSVG(true);

  i++;
  figEl.style.transition="filter .25s";
  figEl.style.filter="drop-shadow(0 0 70px "+state.deity.glow+")";
  setTimeout(function(){figEl.style.filter="drop-shadow(0 0 46px "+state.deity.glow+"88)";
   setTimeout(next,230);},230);

/* ========== 合影 ========== */
function svgToImg(svg){return new Promise(function(res,rej){var im=new Image();
 im.onload=function(){res(im)};im.onerror=function(){rej(new Error("svg"))};
 im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);});}
function doPhoto(){
 var d=state.deity,v=$("#cam");
 var fr=figEl.getBoundingClientRect(),cr=$("#censer").getBoundingClientRect();
 var ready=(document.fonts&&document.fonts.ready)?document.fonts.ready:Promise.resolve();
 toast(U("composing"));
 Promise.all([svgToImg(figureSVG(d,true)),svgToImg(censerSVG(state.incense,true)),ready])
 .then(function(r){
  var vw=innerWidth,vh=innerHeight,W=1080,H=Math.round(W*vh/vw),k=W/vw;
  var c=document.createElement("canvas");c.width=W;c.height=H;var g=c.getContext("2d");
  if(stream&&v.videoWidth>0){
   var vr=v.videoWidth/v.videoHeight,cR=W/H,sw,sh;
   if(vr>cR){sh=v.videoHeight;sw=sh*cR;}else{sw=v.videoWidth;sh=sw/cR;}
   g.drawImage(v,(v.videoWidth-sw)/2,(v.videoHeight-sh)/2,sw,sh,0,0,W,H);
  }else{
   var lg=g.createLinearGradient(0,0,0,H);
   lg.addColorStop(0,"#1a0f0b");lg.addColorStop(.45,"#120b08");lg.addColorStop(1,"#0b0907");
   g.fillStyle=lg;g.fillRect(0,0,W,H);
   var rg=g.createRadialGradient(W/2,H*0.42,0,W/2,H*0.42,W*0.75);
   rg.addColorStop(0,"rgba(216,171,85,.18)");rg.addColorStop(1,"rgba(216,171,85,0)");
   g.fillStyle=rg;g.fillRect(0,0,W,H);
  }
  drawSmoke(g,k);
  g.save();g.shadowColor="rgba(216,171,85,.55)";g.shadowBlur=40*k;
  g.drawImage(r[0],fr.left*k,fr.top*k,fr.width*k,fr.height*k);g.restore();
  g.drawImage(r[1],cr.left*k,cr.top*k,cr.width*k,cr.height*k);
  var bh=Math.round(H*0.105);
  g.fillStyle="rgba(11,9,7,.74)";g.fillRect(0,H-bh,W,bh);
  g.strokeStyle="rgba(216,171,85,.5)";g.lineWidth=3;
  g.beginPath();g.moveTo(0,H-bh);g.lineTo(W,H-bh);g.stroke();
  g.textAlign="center";
  g.fillStyle="#f6dfa8";g.font='600 '+Math.round(bh*0.30)+'px "Noto Serif TC",serif';
  g.fillText(d.name,W/2,H-bh*0.60);
  g.fillStyle="#a2978c";g.font=Math.round(bh*0.17)+'px "Noto Sans TC",sans-serif';
  g.fillText(d.bless,W/2,H-bh*0.33);
  g.fillStyle="#6d645c";g.font=Math.round(bh*0.14)+'px "Noto Sans TC",sans-serif';
  g.fillText("掌心香火",W/2,H-bh*0.11);
  c.toBlob(function(b){ if(!b){toast("合成失敗，請再試一次");return;} showPhoto(b); },"image/png");
 }).catch(function(){toast("合成失敗，請再試一次");});
}
function showPhoto(blob){
 var url=URL.createObjectURL(blob);
 openSheet('<h2 style="color:#f6dfa8">'+U("photoT")+'</h2><p class="sub">'+U("photoS")+'</p>'+
  '<img class="shot" src="'+url+'" alt="與'+esc(state.deity.name)+'的合影">'+
  '<div class="sheet-btns"><button class="sbtn" data-close>'+U("close")+'</button>'+
  '<button class="sbtn primary" id="bSave">'+U("save")+'</button></div>');
 $("#bSave").addEventListener("click",function(){savePhoto(blob)});
}
function savePhoto(blob){
 var name="掌心香火-"+state.deity.name+".png";
 if(DL){ DL.save({filename:name,data:blob}).then(function(){toast(U("saved"))},
   function(err){ if(!(err&&err.code==="declined")) toast("無法直接儲存，長按圖片試試"); });
  return; }
 try{var u=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){a.remove();URL.revokeObjectURL(u)},1500);}catch(e){}
 toast("若未自動下載，長按圖片可儲存");
}

/* ========== 面板 ========== */
function openSheet(html){
 sheetEl.className="sheet"; sheetEl.hidden=false;
 sheetEl.innerHTML='<div class="sheet-in gut" role="dialog" aria-modal="true">'+html+'</div>';
 var f=sheetEl.querySelector(".sbtn"); if(f) f.focus();
}
function closeSheet(){ sheetEl.hidden=true; sheetEl.innerHTML=""; shakeWant=null; }
sheetEl.addEventListener("click",function(e){
 if(e.target===sheetEl){closeSheet();return;}
 if(e.target.closest("[data-close]")){closeSheet();return;}
 var ag=e.target.closest("[data-again]");
 if(ag){closeSheet();setTimeout(doJiao,140);return;}
 var q=e.target.closest("[data-q]");
 if(!q) return;
 var w=q.dataset.q;
 if(w==="ask"||w==="confirm") qianStep(w);
 else if(w==="draw") drawLot();
 else if(w==="next") renderQian();
 else if(w==="show") showLot(qs.lot);
 else if(w==="again"){ qs={phase:"ask",lot:null,ok:0}; renderQian(); }
});
$(".rail").addEventListener("click",function(e){
 var b=e.target.closest(".act"); if(!b||b.disabled) return;
 var a=b.dataset.act;
 if(a==="incense"){ rite.on?endRite():startRite(); }
 if(a==="jiao") doJiao();
 if(a==="qian") doQian();
 if(a==="photo") doPhoto();
});
addEventListener("keydown",function(e){
 if(e.key!=="Escape") return;
 if(!sheetEl.hidden){closeSheet();return;}
 if(!pageEl.hidden){pageEl.hidden=true;return;}
 if(rite.on){endRite();$("#bIncense").classList.add("lit");return;}
 if(!altarEl.hidden) closeAltar();
});

function gwish(d){ return LANG==="en" ? (GOD_EN[d.id].wish) : d.wish; }
function gbless(d){ return LANG==="en" ? (GOD_EN[d.id].bless) : d.bless; }

 }

var ROM={pin:false,tl:false};
function showLot(L){
 shakeWant=null;
 var hi=QIAN.wish[state.deity.wish], rows="";
 for(var i=0;i<QIAN.show.length;i++){var k=QIAN.show[i];
  rows+='<div class="row'+(k===hi?" hi":"")+'"><dt>'+esc(UI.J[k][LANG==="en"?1:0])+'</dt>'+
        '<dd>'+esc(L.jie[k]||"—")+'</dd></div>';
 }
 var story=String(L.story||"").replace(/^[0-9一二三四五六七八九十]+[、.]\s*/,"");
 var rom="";
 if(ROM.pin&&PIN[L.i]) rom+='<div class="rom-line">'+PIN[L.i].join("<br>")+'</div>';
 if(ROM.tl&&TL[L.i])   rom+='<div class="rom-line tl-line">'+TL[L.i].join("<br>")+'</div>';

  '<p class="sub">'+esc(L.gz)+'　'+esc(L.wuxing)+'</p>'+
